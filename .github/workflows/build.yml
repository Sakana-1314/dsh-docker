name: 检查并构建

on:
  schedule:
    # Daily at 02:00 UTC -- check upstream for a new dsh release tag.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'dsh git ref 构建（如 dsh-v0.1.0-rc.7 / 分支 / commit，留空 = 最新发布标签）'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - '**.md'
      - '.github/**'

permissions:
  contents: write # to commit the updated VERSION file

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  IMAGE: misaka-network/deepseek-harness

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 定时轮询到上游版本变更时，先让 VERSION 前进（写入 + 提交 + 推送），再构建镜像。
      # 版本解析与 VERSION 同步各自是一个单一职责脚本，见 docs/scripts.md。
      - name: 解析 dsh 版本
        id: version
        run: scripts/dsh-version/resolve-version.sh "${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 同步 VERSION 文件
        id: version-file
        run: scripts/dsh-version/sync-version-file.sh "${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 判断是否需要构建
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.version-file.outputs.changed }}" != "true" ]; then
            echo "Up to date at ${{ steps.version.outputs.version }} -- nothing to build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building ${{ steps.version.outputs.ref }} (version ${{ steps.version.outputs.version }})."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云 CCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_CCR_USERNAME }}
          password: ${{ secrets.TENCENT_CCR_PASSWORD }}

      - name: 构建并推送
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DSH_REF=${{ steps.version.outputs.ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=deepseek-harness
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
